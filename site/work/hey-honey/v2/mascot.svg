<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" role="img" aria-label="Honey bee mascot">
  <defs>
    <radialGradient id="hh-bee-body" cx="35%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="45%" stop-color="#FFC857"/>
      <stop offset="85%" stop-color="#D88A1A"/>
      <stop offset="100%" stop-color="#A35F0B"/>
    </radialGradient>
    <radialGradient id="hh-bee-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F58B3F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F58B3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hh-bee-wing" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- antennae -->
  <g fill="none" stroke="#1B130A" stroke-width="2.8" stroke-linecap="round">
    <path d="M105 42 q-8 -18 -22 -26"/>
    <path d="M148 42 q8 -18 22 -26"/>
  </g>
  <circle cx="83" cy="14" r="4" fill="#1B130A"/>
  <circle cx="170" cy="14" r="4" fill="#1B130A"/>

  <!-- wings -->
  <g opacity="0.75">
    <ellipse cx="58" cy="92" rx="38" ry="24" fill="url(#hh-bee-wing)" transform="rotate(-22 58 92)" stroke="#1B130A" stroke-width="1.6" stroke-opacity="0.35"/>
    <ellipse cx="200" cy="92" rx="38" ry="24" fill="url(#hh-bee-wing)" transform="rotate(22 200 92)" stroke="#1B130A" stroke-width="1.6" stroke-opacity="0.35"/>
  </g>

  <!-- body -->
  <circle cx="130" cy="130" r="92" fill="url(#hh-bee-body)"/>
  <!-- soft blush -->
  <circle cx="90" cy="160" r="22" fill="url(#hh-bee-blush)"/>
  <circle cx="172" cy="160" r="22" fill="url(#hh-bee-blush)"/>

  <!-- closed smiling eyes -->
  <path d="M97 117 q9 -11 18 0" stroke="#1B130A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M145 117 q9 -11 18 0" stroke="#1B130A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M115 145 q15 16 30 0" stroke="#1B130A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- wobble marks -->
  <g stroke="#1B130A" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M232 110 l10 -3"/>
    <path d="M236 130 l11 1"/>
    <path d="M232 150 l10 4"/>
    <path d="M28 110 l-10 -3"/>
    <path d="M24 130 l-11 1"/>
    <path d="M28 150 l-10 4"/>
  </g>
</svg>
